name: Build Studio workbook
# Learning Studio standard, generated in the cloud from any device (no laptop).
# Record -> upload to Drive (or YouTube) -> run this workflow -> workbook published to Pages.
on:
  workflow_dispatch:
    inputs:
      drive_id:
        description: "Google Drive file ID (shared 'anyone with the link'). Leave blank if using a YouTube link."
        required: false
        default: ""
      youtube:
        description: "YouTube ID/URL (use this instead of drive_id to get CLICKABLE chapters)."
        required: false
        default: ""
      course:
        description: "Course"
        required: true
        type: choice
        default: "MM12"
        options: [MM12, COM11, IBDS, CP12]
      domain:
        description: "Format domain"
        required: true
        type: choice
        default: "software"
        options: [software, inquiry]
      dest_path:
        description: "Publish path in this repo (folder/name/index.html)"
        required: true
        default: "animate/character-rigging/index.html"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install deps
        working-directory: scribe-studio
        run: npm install --no-audit --no-fund
      - name: Build workbook (Learning Studio standard)
        working-directory: scribe-studio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          SRC="${{ inputs.youtube }}"
          if [ -z "$SRC" ]; then SRC="${{ inputs.drive_id }}"; fi
          if [ -z "$SRC" ]; then echo "Provide drive_id or youtube"; exit 1; fi
          node build-studio.mjs \
            --input "$SRC" \
            --course "${{ inputs.course }}" \
            --domain "${{ inputs.domain }}" \
            --dest "${{ github.workspace }}/${{ inputs.dest_path }}"
      - name: Commit and publish
        run: |
          git config user.name "scribeit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${{ inputs.dest_path }}"
          git commit -m "Publish studio workbook to ${{ inputs.dest_path }}" || { echo "no changes"; exit 0; }
          git push
      - name: Summary
        run: echo "Published → https://ctwadden.github.io/multimedia-12/${{ inputs.dest_path }}" >> "$GITHUB_STEP_SUMMARY"
